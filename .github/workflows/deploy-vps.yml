name: LPBank Smart Audit 4.0 - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Bỏ qua bước tests khi cần deploy khẩn cấp (true/false)'
        required: false
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1. CI JOB: TEST & BUILD ARTIFACTS
  # ═══════════════════════════════════════════════════════════════════
  build-and-test:
    name: 🧪 Continuous Integration (Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Saigon
      APP_TZ: Asia/Saigon

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔤 Install Fonts for PDF Generation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # --- BACKEND ---
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps

      - name: 🔍 Backend Type Check & Lint
        run: |
          cd backend
          npx tsc -p tsconfig.build.json --noEmit

      - name: 🏗️ Build Backend (NestJS Fastify)
        run: |
          cd backend
          npm run build:tsc

      # --- FRONTEND ---
      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps

      - name: 🔍 Frontend Type Check
        # Trước đây bước này để continue-on-error: true nên lỗi type KHÔNG chặn CI,
        # và đã che 5 lỗi tham chiếu hàm/biến không tồn tại (crash runtime thật).
        # Bộ type hiện đã sạch (0 lỗi) ⇒ bật chặn thật để không tái phát.
        run: |
          cd frontend
          npx tsc -b --noEmit

      - name: 🏗️ Build Frontend (Vite + React 19)
        run: |
          cd frontend
          npm run build

      # --- AUTOMATED INTEGRATION TESTS ---
      - name: 🧪 Backend Unit Tests (Jest)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          cd backend
          # --runInBand: chạy tuần tự để CI ổn định (tránh phụ thuộc worker/port,
          # đây cũng là cấu hình đã được kiểm chứng toàn bộ 118 suite / 957 test).
          npm test -- --ci --runInBand --reporters=default

      - name: 🧪 Frontend Unit Tests (Vitest)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          cd frontend
          npm test

      - name: 🧪 Run Master Architectural Integrity Tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          echo "1. Running Phase A-F architecture verifiers..."
          node scripts/verify-all-phases.cjs
          echo "2. Running ADR-0012 Git hygiene verifier..."
          node scripts/verify-phase5.cjs
          echo "3. Running 70/70 routing and menu integrity verification..."
          node scripts/verify-all-routed-and-menu.cjs
          echo "4. Running engagement fieldwork refactor verification..."
          node scripts/verify-engagement-fieldwork-refactor.cjs
          echo "5. Running RBIA planning hub verification..."
          node scripts/verify-rbia-planning-hub.cjs
          echo "6. Running tasks and KPI verification..."
          node scripts/verify-tasks-kpi-bks.cjs

      # --- ARTIFACT PACKAGING ---
      - name: 🗜️ Compress Production Artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-bundle
          # Package backend dist & package files
          tar -czf release-bundle/backend-dist.tar.gz -C backend dist package.json package-lock.json templates
          # Package frontend static dist
          tar -czf release-bundle/frontend-dist.tar.gz -C frontend/dist .
          # Include database migrations
          tar -czf release-bundle/migrations.tar.gz -C backend/src/database migrations

      - name: 💾 Upload Release Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: release-bundle/
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════
  # 2. CD JOB: DEPLOY TO VPS CHINHTA.IO.VN
  # ═══════════════════════════════════════════════════════════════════
  deploy-to-vps:
    name: 🚀 Continuous Deployment (VPS chinhta.io.vn)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: release-bundle

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: 📤 Transfer Artifacts to VPS
        run: |
          echo "Transferring release archives to ${{ secrets.VPS_HOST }} via IPv4..."
          scp -4 -i ~/.ssh/id_ed25519 -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -P ${{ secrets.VPS_PORT || 22 }} release-bundle/*.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: 🔄 Execute Atomic Deployment & PM2 Reload on VPS
        run: |
          ssh -4 -i ~/.ssh/id_ed25519 -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -se' << 'EOF'
            set -e
            APP_DIR="/var/www/phanmem"
            BACKUP_DIR="/var/www/phanmem_backups/$(date +%Y%m%d_%H%M%S)"
            
            echo "=========================================="
            echo "   STARTING LPBANK KTNB DEPLOYMENT        "
            echo "=========================================="
            
            # 1. Tạo backup phiên bản hiện tại phòng khi rollback
            mkdir -p "$BACKUP_DIR"
            if [ -d "$APP_DIR/backend/dist" ]; then
              echo ">>> Backing up current backend..."
              cp -r "$APP_DIR/backend/dist" "$BACKUP_DIR/backend_dist"
            fi
            if [ -d "$APP_DIR/frontend/dist" ]; then
              echo ">>> Backing up current frontend..."
              cp -r "$APP_DIR/frontend/dist" "$BACKUP_DIR/frontend_dist"
            fi

            # 2. Giải nén Backend
            echo ">>> Deploying Backend..."
            mkdir -p "$APP_DIR/backend"
            tar -xzf /tmp/backend-dist.tar.gz -C "$APP_DIR/backend"
            
            # 2.5. Cài đặt/đồng bộ Backend dependencies trên VPS
            echo ">>> Installing Backend dependencies..."
            cd "$APP_DIR/backend"
            npm ci --legacy-peer-deps --omit=dev --ignore-scripts || npm install --legacy-peer-deps --omit=dev --ignore-scripts
            
            # 3. Giải nén Migrations & Chạy Migration DB
            #    LỖI ĐÃ SỬA (TC-FIND-01/02): trước đây bước này là
            #      `npm run migration:run || echo "Migration warning: check logs"`
            #    → migration thất bại vẫn được coi là thành công, nên cột
            #    `audit_engagements."teamMembers"` mãi không được chuyển sang
            #    jsonb và production âm thầm chạy code mới trên schema cũ.
            #    Từ nay migration lỗi ⇒ deploy DỪNG NGAY (set -e).
            echo ">>> Running Database Migrations..."
            mkdir -p "$APP_DIR/backend/src/database"
            tar -xzf /tmp/migrations.tar.gz -C "$APP_DIR/backend/src/database"
            cd "$APP_DIR/backend"
            if [ -f "dist/data-source.js" ]; then
              echo ">>> Migration status BEFORE:"
              npm run migration:show || true
              echo ">>> Applying pending migrations..."
              npm run migration:run
              echo ">>> Migration status AFTER:"
              npm run migration:show || true
            else
              echo "!!! dist/data-source.js KHÔNG tồn tại — bỏ qua migration. Kiểm tra lại bước build." >&2
            fi

            # 4. Giải nén Frontend
            echo ">>> Deploying Frontend..."
            mkdir -p "$APP_DIR/frontend/dist"
            rm -rf "$APP_DIR/frontend/dist"/*
            tar -xzf /tmp/frontend-dist.tar.gz -C "$APP_DIR/frontend/dist"

            # 5. Phân quyền www-data
            echo ">>> Setting file permissions..."
            chown -R www-data:www-data "$APP_DIR/backend" "$APP_DIR/frontend"

            # 6. Dọn dẹp file tạm trên /tmp
            rm -f /tmp/backend-dist.tar.gz /tmp/frontend-dist.tar.gz /tmp/migrations.tar.gz

            # 7. Reload PM2 (Zero-downtime cluster reload)
            echo ">>> Reloading PM2 services..."
            pm2 reload nestjs-backend --update-env || pm2 restart nestjs-backend
            pm2 reload ktnb-collab --update-env || pm2 restart ktnb-collab
            pm2 status

            # 8. Test cấu hình và Reload Nginx
            echo ">>> Testing and Reloading Nginx..."
            nginx -t
            systemctl reload nginx

            # 9. SMOKE TEST chống tái phát lỗi 500 (TC-FIND-01/02)
            #    1213 unit test đều mock repository nên KHÔNG test nào chạm
            #    PostgreSQL thật → lỗi `operator does not exist: text @> jsonb`
            #    lọt ra production. Smoke test dưới đây gọi API thật và
            #    fail cứng nếu endpoint không trả 200.
            echo ">>> Smoke test: GET /api/audit-findings..."
            sleep 5
            SMOKE_CODE=$(curl -s -o /tmp/smoke_findings.json -w '%{http_code}' \
              -X GET 'http://127.0.0.1:3000/api/audit-findings?limit=1' \
              -H 'Accept: application/json' || echo '000')
            echo "    HTTP status: $SMOKE_CODE"
            if [ "$SMOKE_CODE" = "401" ] || [ "$SMOKE_CODE" = "403" ]; then
              echo "    OK: endpoint phản hồi (chặn quyền như mong đợi, không phải 500)."
            elif [ "$SMOKE_CODE" = "200" ]; then
              echo "    OK: endpoint trả 200."
            else
              echo "!!! SMOKE TEST THẤT BẠI: /api/audit-findings trả $SMOKE_CODE (kỳ vọng 200/401/403)." >&2
              cat /tmp/smoke_findings.json >&2 || true
              exit 1
            fi

            echo "=========================================="
            echo "   DEPLOYMENT SUCCEEDED ON VPS!          "
            echo "=========================================="
          EOF

      - name: 🩺 Post-Deployment Smoke Test (Health Check)
        run: |
          echo "Verifying live endpoint https://chinhta.io.vn..."
          sleep 5
          HTTP_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://chinhta.io.vn/ || true)
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Production site is UP and healthy (HTTP $HTTP_STATUS)!"
          else
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: 📥 Checkout Verification Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts

      - name: 🏆 16-Module API Regression Verification on Live VPS
        run: |
          echo "Executing comprehensive 16-module API test against https://chinhta.io.vn..."
          node scripts/test-api-comprehensive.cjs --target=vps

