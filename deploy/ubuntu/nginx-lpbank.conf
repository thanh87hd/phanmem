# ==============================================================================
# NGINX REVERSE PROXY & STATIC HOSTING CONFIGURATION
# Hệ thống: LPBank Smart Audit 4.0
# File vị trí trên Ubuntu: /etc/nginx/sites-available/lpbank-audit.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/lpbank-audit.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream trỏ đến backend NestJS/Fastify chạy qua PM2
upstream backend_cluster {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream trỏ đến Keycloak IAM SSO
upstream keycloak_service {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 1. HTTP Server - Chuyển hướng toàn bộ sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chinhta.io.vn; # Thay bằng domain hoặc IP máy chủ của bạn

    # Cho phép Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Phục vụ ứng dụng chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chinhta.io.vn; # Thay bằng domain thực tế

    # Chứng chỉ SSL (Do Certbot quản lý hoặc chứng thư số nội bộ ngân hàng)
    ssl_certificate /etc/letsencrypt/live/chinhta.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinhta.io.vn/privkey.pem;
    
    # Cấu hình chuẩn bảo mật SSL TLS 1.2 & 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers & Hardening (Chuẩn Ngân hàng)
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff2;

    # Thư mục chứa mã nguồn Frontend đã build (dist)
    root /var/www/phanmem/frontend/dist;
    index index.html;

    # Giới hạn dung lượng tải tệp lên (khớp với cấu hình 50MB của Fastify)
    client_max_body_size 50M;

    # 2.1. Cấu hình Frontend SPA (React / React-Router)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control cho file index.html (luôn cập nhật bản mới nhất)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # Cache control cho static assets (JS, CSS, fonts, ảnh)
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }
    }

    # 2.2. Reverse Proxy cho toàn bộ API Backend
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # WebSocket & Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers nhận diện client thực tế
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts cho tác vụ nặng (Xuất Excel 40 cột, AI phân tích, bulk import)
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;

        # Proxy Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 256k;
    }

    # 2.3. Reverse Proxy cho Keycloak IAM SSO (OIDC / OAuth 2.0)
    location ~* ^/(realms|resources)/ {
        proxy_pass http://keycloak_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffer_size 128k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 256k;
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
