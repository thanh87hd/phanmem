version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lpbank_audit_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ktnb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_DATABASE:-ktnb_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ktnb_user} -d ${DB_DATABASE:-ktnb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lpbank_audit_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: lpbank_audit_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      BIND_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-ktnb_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-ktnb_db}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://audit.lpbank.com.vn}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENABLE_DEMO_SEED: "false"
      ENABLE_DOCUMENTATION: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: lpbank_audit_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: lpbank_audit_keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin@2026}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../keycloak/keycloak-realm-lpbank.json:/opt/keycloak/data/import/keycloak-realm-lpbank.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  keycloak_data:
